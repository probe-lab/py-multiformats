[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "py-multiformats"
version = "0.1.0a1"
description = "Python bindings for the Rust multiformats implementations (multibase, multihash, multiaddr, CID)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["multiformats", "multibase", "multihash", "multiaddr", "cid", "ipfs", "ipld", "libp2p"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Repository = "https://github.com/probe-lab/py-multiformats"

[dependency-groups]
dev = ["maturin>=1.7,<2.0", "pytest>=8", "mypy>=1.10"]

[tool.maturin]
python-source = "python"
module-name = "multiformats._multiformats"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
